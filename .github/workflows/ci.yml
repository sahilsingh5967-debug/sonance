name: Sonance CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Run ESLint Linter
        run: npm run lint

      - name: 🧪 Run Automated Test Suite
        run: npm test

      - name: 📊 Display CI Pipeline Success Summary
        if: success()
        run: |
          echo "=================================================="
          echo "✅ SONANCE CI PIPELINE PASSED SUCCESSFULLY!"
          echo "All ES6 unit tests & linter rules executed clean."
          echo "=================================================="
